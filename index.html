• Optional für Weihnachtsstimmung: Eine Prise Zimt oder Spekulatiusgewürz

Zubereitung <br>

1. Paste anrühren (verhindert Klümpchen): Das Kakaopulver, den Zucker, den Vanillezucker und das Salz in einen kleinen Topf geben. Etwa 4 EL von der kalten Milch dazugiessen und alles mit einem Löffel oder Schwingbesen zu einer glatten, klümpchenfreien Schokopaste verrühren. <br>
2. Milch erwärmen: Die restliche Milch unter ständigem Rühren nach und nach dazugiessen. <br>
3. Erhitzen: Den Kakao bei mittlerer Hitze erwärmen und dabei regelmässig umrühren, damit nichts am Topfboden anbrennt. Kurz vor dem Kochen vom Herd nehmen. <br>
4. Servieren: Den Kakao in zwei Tassen füllen. Nach Wunsch mit etwas Milchschaum, geschlagenem Rahm oder einer Prise Zimt toppen. <br>

Zutaten

Für den Teig:
• 350 g Weizenmehl (Type 405)
• 100 g weiche Butter
• 100 g brauner Zucker
• 120 g flüssiger Honig (oder Zuckerrübensirup für eine dunklere Farbe)
• 1 Ei (Grösse M)
• 2 TL Lebkuchengewürz
• 1 TL Zimt
• 1 TL Backpulver
• 1 Prise Salz
Für die Verzierung (Zuckerguss):
• 150 g Puderzucker (gesiebt)
• 1 frisches Eiweiss (oder 2–3 EL Zitronensaft / Wasser)
• Optional: Zuckerperlen, Schokolinsen oder bunte Streusel für Knöpfe und Augen

Zubereitung

1. Butter, Zucker und Honig schlagen: Weiche Butter, braunen Zucker und Honig in einer Schüssel cremig rühren. Das Ei dazugeben und kurz unterschlagen.
2. Trockene Zutaten einarbeiten: Mehl, Lebkuchengewürz, Zimt, Backpulver und Salz mischen. Die Mehlmischung nach und nach zur Buttermasse geben und alles rasch zu einem glatten, festen Teig verkneten.
3. Teig kühlen: Den Teig zu einer Kugel formen, in Frischhaltefolie wickeln und für mindestens 1 Stunde (gerne auch über Nacht) in den Kühlschrank legen. So lässt er sich später perfekt auswallen.
4. Auswallen & Ausstechen: Den Backofen auf 180 °C Ober-/Unterhitze (Umluft: 160 °C) vorheizen und zwei Backbleche mit Backpapier auslegen. Den Teig auf einer leicht bemehlten Arbeitsfläche ca. 4–5 mm dick auswallen und Lebkuchenmännchen ausstechen.
5. Backen: Die Männchen mit etwas Abstand auf die Bleche legen und 10–12 Minuten backen, bis die Ränder leicht gebräunt sind. Auf einem Kuchengitter komplett auskühlen lassen.
6. Verzieren: Den gesiebten Puderzucker mit dem Eiweiss (oder Zitronensaft) zu einem dicken, spritzfähigen Guss glattrühren. Den Guss in einen kleinen Gefrierbeutel füllen, eine winzige Ecke abschneiden und den Lebkuchenmännchen Gesichter, Knöpfe und Konturen aufmalen.
